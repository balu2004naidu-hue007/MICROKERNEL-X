name: MICROKERNEL-X CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Host and ARM/QEMU Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install toolchains and emulator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi gdb-multiarch qemu-system-arm
      - name: Clean build and run host tests
        run: |
          make clean
          make test-host
      - name: Build ARM firmware and run QEMU tests
        run: make test-arm-qemu
